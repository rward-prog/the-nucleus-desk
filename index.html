<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Central: The Nucleus Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#2d2a33; --wall2:#232027; --desk:#5b4636; --desk2:#463529;
  --paper:#e4d8b4; --paper2:#d3c497; --ink:#2b2622; --ink2:#5e5040;
  --red:#a8352b; --green:#47703c; --brass:#c99a3f; --text:#efe5cc; --muted:#b5a68a;
  --line:#110e12; --shadow:#000;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --wall:#211e26; --wall2:#19171d; --desk:#4e3c2f; --desk2:#3b2d23; --text:#f1e8d0; --muted:#a99a80; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--wall);
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 6px);
  color:var(--text); font-family:'VT323', monospace; font-size:22px; line-height:1.2;
}
h1,h2,h3,.ps{font-family:'Press Start 2P', monospace; font-weight:normal}
button{font:inherit}
img.px{image-rendering:pixelated}
.btn{
  font-family:'Press Start 2P', monospace; font-size:12px; line-height:1.4;
  background:var(--brass); color:var(--ink); border:4px solid var(--line);
  box-shadow:4px 4px 0 var(--line); padding:12px 16px; cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--line)}
.btn.big{font-size:14px; padding:14px 22px}
.btn.quiet{background:var(--paper2)}
.btn.danger{background:var(--red);color:#fff}
button:focus-visible, input:focus-visible{outline:3px dashed var(--brass); outline-offset:3px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:20px}

/* title */
.center-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.sign{background:var(--desk);border:6px solid var(--line);box-shadow:8px 8px 0 var(--shadow);padding:28px;max-width:660px;width:100%;text-align:center}
.sign-top{font-family:'Press Start 2P';font-size:12px;color:var(--brass);margin-bottom:12px}
.sign h1{font-size:26px;color:var(--paper);text-shadow:4px 4px 0 var(--shadow);line-height:1.5;margin:0 0 14px}
.sign .lead{font-size:24px;max-width:52ch;margin:0 auto 16px}
.hero-icons{display:flex;justify-content:center;gap:10px;margin:8px 0 18px}
.hero-icons img{width:48px;height:48px;image-rendering:pixelated;background:var(--paper2);border:3px solid var(--line);padding:2px}
.namelab{display:block;font-family:'Press Start 2P';font-size:10px;margin-bottom:8px;color:var(--paper)}
.sign input{font-family:'VT323';font-size:28px;padding:8px 10px;width:100%;max-width:360px;background:var(--paper);color:var(--ink);border:4px solid var(--line);margin-bottom:16px;text-align:center}
.sound-row{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.tbtn{font-family:'Press Start 2P';font-size:9px;background:var(--wall2);color:var(--text);border:3px solid var(--line);padding:8px 10px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.tbtn.on{background:var(--green);color:#fff}
.credit{color:var(--muted);font-size:20px}

/* map */
.map{min-height:100vh;padding:16px 20px;display:flex;flex-direction:column;gap:14px;max-width:1300px;margin:0 auto}
.maphead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.maphead h2{font-size:16px;margin:0;color:var(--paper)}
.maphead p{margin:6px 0 0;color:var(--muted)}
.mapgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:start}
.colhead{font-family:'Press Start 2P';font-size:11px;color:var(--brass);margin:0 0 10px}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:4px solid var(--line);box-shadow:5px 5px 0 var(--shadow);padding:12px;margin-bottom:12px;cursor:pointer}
.card img{width:52px;height:52px;image-rendering:pixelated;flex:none}
.card .cname{font-family:'Press Start 2P';font-size:11px;line-height:1.5}
.card .cdesc{font-size:20px;color:var(--ink2)}
.card .cstat{margin-left:auto;font-family:'Press Start 2P';font-size:10px;padding:6px;border:3px solid var(--line);flex:none}
.card.open .cstat{background:var(--brass)}
.card.done .cstat{background:var(--green);color:#fff}
.card.locked,.card.soon{background:var(--paper2);opacity:.75;cursor:not-allowed}
.card.locked .cstat,.card.soon .cstat{background:#777;color:#eee}
.bodyzone{background:var(--desk);border:6px solid var(--line);box-shadow:6px 6px 0 var(--shadow);padding:16px 10px}
.bodyzone .colhead{text-align:center}
.bodywrap{position:relative;width:220px;margin:0 140px}
.bodywrap img{width:220px;display:block;image-rendering:pixelated}
.node{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center}
.node .dot{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:4px solid var(--line);font-family:'Press Start 2P';font-size:9px;background:#555;color:#ddd;box-shadow:3px 3px 0 var(--shadow)}
.node.open .dot{background:var(--brass);color:var(--ink);animation:pulse 1.2s steps(2) infinite}
.node.done .dot{background:var(--green);color:#fff}
.node.secret .dot{background:#2b2830;color:var(--brass)}
.node .nl{position:absolute;white-space:nowrap;font-family:'Press Start 2P';font-size:8px;line-height:1.6;background:var(--wall2);border:3px solid var(--line);padding:4px 6px;color:var(--text);text-align:left}
.node.L .nl{right:38px;text-align:right}
.node.R .nl{left:38px}
.nl small{color:var(--muted);font-size:7px}
.skipbtn{display:block;margin:-2px 0 12px auto;font-size:10px;padding:8px 12px}
.hs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;max-width:520px}
.hs li{display:grid;grid-template-columns:44px 1fr 34px 70px;gap:8px;align-items:center;background:#efe6c8;border:3px solid var(--ink2);padding:4px 8px;font-size:21px}
.hs li.me{background:var(--brass);border-color:var(--line)}
.hrank,.hgrade,.hscore{font-family:'Press Start 2P';font-size:10px}
.hscore{text-align:right}
.hname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newhs{font-family:'Press Start 2P';font-size:12px;color:var(--green);margin:6px 0}
.mapmsg{min-height:30px;text-align:center;color:var(--paper);font-size:22px}
.mapfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:19px}

/* briefing */
.brief{padding:20px;display:flex;justify-content:center}
.paper{background:var(--paper);color:var(--ink);border:4px solid var(--line);box-shadow:6px 6px 0 var(--shadow);padding:20px 24px}
.paper.wide{max-width:1040px;width:100%}
.paper-head{display:flex;justify-content:space-between;font-family:'Press Start 2P';font-size:10px;border-bottom:3px dashed var(--ink2);padding-bottom:10px;color:var(--ink2);gap:10px;flex-wrap:wrap}
.paper h2{font-size:20px;margin:16px 0 10px}
.paper h3{font-size:12px;margin:18px 0 10px}
.role{font-size:25px;max-width:70ch;margin:0 0 12px}
.rules{background:var(--paper2);border:3px solid var(--ink2);padding:10px 14px;font-size:22px}
.rules p{margin:4px 0}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.gcard{display:flex;gap:10px;background:#efe6c8;border:3px solid var(--ink2);padding:8px;align-items:flex-start}
.gcard img{width:44px;height:44px;image-rendering:pixelated;flex:none}
.gname{font-family:'Press Start 2P';font-size:10px;line-height:1.5;margin-bottom:4px}
.gjob{font-size:21px}
.gtip{font-size:20px;color:var(--ink2);margin-top:4px}
.row{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}

/* desk */
.desk{height:100vh;display:grid;grid-template-rows:auto 1fr auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--wall2);border-bottom:4px solid var(--line);flex-wrap:wrap}
.tb-left,.tb-mid,.tb-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tb-cell{font-family:'Press Start 2P';font-size:12px;color:var(--paper)}
.modetag{font-family:'Press Start 2P';font-size:8px;padding:4px 6px;border:3px solid var(--line)}
.modetag.gentle{background:var(--green);color:#fff}
.modetag.penalty{background:var(--red);color:#fff}
.tb-mid span{font-family:'Press Start 2P';font-size:10px}
#streak{color:var(--brass)}
.floor{display:grid;grid-template-columns:190px 1fr 210px;gap:12px;padding:12px;min-height:0;
  background:var(--desk);
  background-image:repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 3px, transparent 3px 22px), repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 9px)}
.inbox,.side{min-height:0}
.inbox h3,.panel h3{font-size:10px;color:var(--brass);margin:0 0 8px}
.inbox{background:rgba(0,0,0,.18);border:4px solid var(--line);padding:10px;display:flex;flex-direction:column}
.pile{position:relative;flex:1;min-height:200px}
.sheet{position:absolute;left:14px;width:130px;height:50px;background:var(--paper);border:3px solid var(--line);box-shadow:2px 2px 0 var(--shadow)}
.sheet::after{content:"";position:absolute;left:10px;right:10px;top:12px;height:12px;border-top:3px solid var(--paper2);border-bottom:3px solid var(--paper2)}
.sheet.em{background:#e7a89c}
.limit{position:absolute;left:0;right:0;border-top:3px dashed var(--red)}
.limit span{font-family:'Press Start 2P';font-size:7px;color:#ffb3a8;background:var(--line);position:relative;top:-9px;left:4px;padding:2px 4px}
.pilecount{font-family:'Press Start 2P';font-size:10px;text-align:center;margin-top:8px}
.pilecount.over{color:#ff8f80;animation:blink .6s steps(2) infinite}
.center{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.memoSlot{width:100%;display:flex;justify-content:center;position:relative;z-index:2}
.under{position:absolute;inset:0;pointer-events:none;z-index:1}
.usheet{position:absolute;left:50%;top:50%;width:min(560px,92%);height:300px;background:var(--paper2);border:4px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.45);padding:10px 14px}
.usheet::after{content:"";position:absolute;left:14px;right:40%;top:44px;height:40px;border-top:4px solid rgba(94,80,64,.35);border-bottom:4px solid rgba(94,80,64,.35)}
.usheet.em{background:#e2a597}
.uhead{font-family:'Press Start 2P';font-size:8px;color:var(--ink2)}
.waiting{font-family:'Press Start 2P';font-size:12px;color:var(--paper);opacity:.75;text-align:center;line-height:1.8}
.memo{width:min(580px,100%);background:var(--paper);color:var(--ink);border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.55);padding:14px 20px 16px;position:relative}
.memo.in{animation:slideIn .35s steps(6)}
.memo.out{transition:transform .3s steps(5),opacity .3s;transform:translateX(130%) rotate(10deg);opacity:0}
.memo.shake{animation:shake .3s steps(6)}
.memo.emergency{background:#f0d2c6;box-shadow:0 0 0 4px var(--red),6px 6px 0 rgba(0,0,0,.55)}
.memo-head{display:flex;justify-content:space-between;font-family:'Press Start 2P';font-size:9px;border-bottom:3px dashed var(--ink2);padding-bottom:8px;margin-bottom:8px;color:var(--ink2);gap:8px}
.alarm{background:var(--red);color:#fff;padding:2px 6px;animation:blink .6s steps(2) infinite}
.mline{font-size:22px}
.mline b{font-family:'Press Start 2P';font-size:9px;margin-right:6px}
.mbody{font-size:28px;line-height:1.12;margin:12px 0}
.tbar{height:14px;border:3px solid var(--line);background:#fff;margin:6px 0 10px}
#tfill{height:100%;background:var(--red);width:100%}
.route{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.route b{font-family:'Press Start 2P';font-size:9px}
.slot{display:inline-block;min-width:46px;padding:5px 6px;border:3px dashed var(--ink2);font-family:'Press Start 2P';font-size:8px;text-align:center}
.slot.filled{border-style:solid;background:var(--green);color:#fff;border-color:var(--line)}
.slot.next{border-color:var(--ink)}
.arrow{font-size:20px;color:var(--ink2)}
.mark{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0;border:5px solid;padding:8px 14px;font-family:'Press Start 2P';font-size:20px;pointer-events:none;text-align:center;background:rgba(228,216,180,.35)}
.mark.show{opacity:.92;transform:translate(-50%,-50%) rotate(-12deg) scale(1);transition:transform .15s steps(3),opacity .15s}
.mark.ok{color:var(--green);border-color:var(--green)}
.mark.bad{color:var(--red);border-color:var(--red)}
.mark.meh{color:var(--ink2);border-color:var(--ink2)}
.mark small{display:block;font-size:8px;margin-top:6px;line-height:1.5}
.banner{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-family:'Press Start 2P';font-size:14px;background:var(--red);color:#fff;border:4px solid var(--line);padding:8px 14px;display:none;z-index:5;white-space:nowrap}
.banner.show{display:block;animation:blink .5s steps(2) 4}
.toast{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:min(580px,96%);background:var(--red);color:#fff;border:4px solid var(--line);padding:8px 12px;font-size:21px;display:none;z-index:5}
.toast.show{display:block}
.pauseov{position:absolute;inset:0;background:rgba(25,22,28,.95);display:none;flex-direction:column;align-items:center;justify-content:center;font-family:'Press Start 2P';font-size:18px;z-index:6;text-align:center;line-height:2}
.pauseov small{font-size:10px;color:var(--muted)}
.pauseov.on{display:flex}
.panel{background:rgba(0,0,0,.25);border:4px solid var(--line);padding:10px;margin-bottom:10px}
.hbar{height:20px;border:3px solid var(--line);background:#1a1216}
#hfill{height:100%;background:var(--green);transition:width .2s steps(4)}
.hnum{font-family:'Press Start 2P';font-size:10px;margin-top:6px}
.bignum{font-family:'Press Start 2P';font-size:18px}
.tip{font-size:20px;color:var(--text)}
.tray{display:grid;gap:8px;padding:10px 12px 14px;background:var(--desk2);border-top:4px solid var(--line)}
.stamp{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 8px;background:var(--paper2);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);cursor:pointer;color:var(--ink);min-width:0}
.stamp .handle{width:42%;height:10px;border:3px solid var(--line)}
.stamp img{width:40px;height:40px;image-rendering:pixelated}
.stamp .sname{font-family:'Press Start 2P';font-size:8px;text-align:center;line-height:1.3;word-break:break-word}
.stamp .key{position:absolute;top:3px;left:5px;font-family:'Press Start 2P';font-size:8px;color:var(--ink2)}
.stamp:hover{background:var(--paper)}
.stamp.rejectst{background:#e6b2a8;border-color:var(--line)}
.stamp.rejectst:hover{background:#f0c4bb}
.stamp.rejectst .sname{color:var(--red)}
.stamp.press,.stamp:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}

/* modals */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{max-width:620px;width:100%;max-height:92vh;overflow:auto}
.modal.bookm{max-width:1000px}
.mhead{font-family:'Press Start 2P';font-size:16px;margin-bottom:12px;line-height:1.4}
.mhead.bad{color:var(--red)}
.answer{display:flex;gap:12px;align-items:center;background:var(--paper2);border:3px solid var(--ink2);padding:8px;margin:8px 0}
.answer img{width:56px;height:56px;image-rendering:pixelated}
.aname{font-family:'Press Start 2P';font-size:13px;line-height:1.5}
.small{font-size:20px;color:var(--ink2)}
.why{font-size:24px}
.jobbox{background:#f5ecd2;border:3px dashed var(--ink2);padding:8px 10px;margin:10px 0 16px;font-size:21px}

/* report */
.review{max-width:760px;width:100%;position:relative}
.gradestamp{position:absolute;top:56px;right:26px;width:110px;height:110px;border:6px solid;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P';font-size:44px;transform:rotate(10deg);opacity:.85}
.gradestamp.g-A,.gradestamp.g-B{color:var(--green);border-color:var(--green)}
.gradestamp.g-C{color:#8a6a1a;border-color:#8a6a1a}
.gradestamp.g-D,.gradestamp.g-F{color:var(--red);border-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:12px 0;max-width:520px}
.stat{background:var(--paper2);border:3px solid var(--ink2);padding:6px 10px}
.stat .v{font-family:'Press Start 2P';font-size:13px;margin-top:4px}
.shut{background:var(--red);color:#fff;padding:10px 14px;border:4px solid var(--line);margin:10px 0;font-size:22px}
.shut b{font-family:'Press Start 2P';font-size:12px;display:block;margin-bottom:6px}
.missed{display:grid;gap:8px}
.mitem{display:flex;gap:10px;align-items:flex-start;background:#efe6c8;border:3px solid var(--ink2);padding:6px 8px}
.mitem img{width:40px;height:40px;image-rendering:pixelated;flex:none}
.fired h1{font-size:30px;color:var(--red);text-shadow:4px 4px 0 var(--shadow);line-height:1.5;margin:0 0 6px}
.fired .lead{font-size:24px;text-align:left;max-width:56ch}

@keyframes slideIn{from{transform:translateY(-50px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@keyframes blink{50%{opacity:.35}}
@keyframes pulse{50%{transform:scale(1.15)}}

@media (max-width:1000px){
  .mapgrid{grid-template-columns:1fr}
  .bodywrap{margin:0 auto 0 140px}
  .desk{height:auto;min-height:100vh}
  .floor{grid-template-columns:1fr}
  .pile{min-height:120px}
  .tray{grid-template-columns:repeat(4,1fr)!important}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>

<script id="game-data">
var ORGANELLES = {
  nucleoid:{name:'Nucleoid (DNA)', short:'DNA', job:'The cell\u2019s instructions. A prokaryote has no nucleus, so its DNA floats in an area called the nucleoid. You are the DNA, so stamp this to keep a job with the DNA, like copying or repairing it.', tip:'Copy before splitting. Fix gene mistakes. Store instructions.', colors:['#5e3a86','#a35fc9','#f0c8ff'],
    icon:['a.......b.','.a.....b..','..accab...','...ab.....','..b.a.....','.b...a....','b.....a...','.b...a....','..bccab...','...b.a....']},
  ribosome:{name:'Ribosome', short:'RIBOSOME', job:'Tiny machines that read instructions and build proteins. Every cell has them, even bacteria.', tip:'Anything made of protein gets built here.', colors:['#7a3e22','#c46a3a','#f2b48a'],
    icon:['..........','...aaaa...','..aaccaa..','..aaaaaa..','...bbbb...','..bbbbbb..','.bbbbbbbb.','.bbbbbbbb.','..bbbbbb..','..........']},
  membrane:{name:'Cell Membrane', short:'MEMBRANE', job:'A thin, flexible layer around the cell. It is the gatekeeper that controls what goes in and out, and it receives messages from outside.', tip:'In, out, and messages at the door.', colors:['#22607d','#56a7c9','#bfe8f7'],
    icon:['..........','cccccccccc','aaaaaaaaaa','a.a.a.a.a.','..........','.a.a.a.a.a','aaaaaaaaaa','cccccccccc','..........','..........']},
  wall:{name:'Cell Wall', short:'CELL WALL', job:'A stiff layer outside the membrane. It protects the cell, holds its shape, and keeps it from bursting.', tip:'Strength, shape, and protection.', colors:['#6b5a2a','#a68f45','#d9c27a'],
    icon:['aaaaaaaaaa','b...b...b.','aaaaaaaaaa','..b...b...','aaaaaaaaaa','b...b...b.','aaaaaaaaaa','..b...b...','aaaaaaaaaa','..........']},
  cytoplasm:{name:'Cytoplasm', short:'CYTOPLASM', job:'The jelly-like fluid that fills the cell. Parts float and move through it, and many chemical reactions happen there.', tip:'The space where things float, mix, and react.', colors:['#2f6e4e','#7cc49a','#d4f5df'],
    icon:['..........','.c....aa..','......aa..','...c......','.aa....c..','.aa.......','.....c..a.','..c.......','.......c..','..........']},
  flagellum:{name:'Flagellum', short:'FLAGELLUM', job:'A whip-like tail that spins like a propeller to move the cell.', tip:'Any job that means moving somewhere.', colors:['#7d5f14','#d4a52a','#f5dc8a'],

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

var AU = {ctx:null, timer:null, track:'office', step:0, next:0, rush:false};
function audioInit(){
  if(AU.ctx) return;
  var C = window.AudioContext || window.webkitAudioContext; if(!C) return;
  AU.ctx = new C();
  AU.master = AU.ctx.createGain(); AU.master.gain.value = 0.8; AU.master.connect(AU.ctx.destination);
  AU.musicGain = AU.ctx.createGain(); AU.musicGain.gain.value = 0.5; AU.musicGain.connect(AU.master);
  AU.sfxGain = AU.ctx.createGain(); AU.sfxGain.gain.value = 0.7; AU.sfxGain.connect(AU.master);
  var len = Math.floor(AU.ctx.sampleRate*0.5);
  AU.noise = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
  var d = AU.noise.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
}
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
function tone(type,freq,t,dur,vol,dest,slideTo){
  var o=AU.ctx.createOscillator(), g=AU.ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.02);
}
function noise(t,dur,vol,dest,hp){
  var s=AU.ctx.createBufferSource(); s.buffer=AU.noise;
  var f=AU.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||5000;
  var g=AU.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+0.02);
}
function sfx(n){
  if(!S.sfx) return; audioInit(); if(!AU.ctx) return;
  if(AU.ctx.state==='suspended') AU.ctx.resume();
  var t=AU.ctx.currentTime, d=AU.sfxGain, i;
  if(n==='stamp'){ noise(t,0.08,0.5,d,700); tone('square',130,t,0.12,0.3,d,60); }

  else if(n==='step'){ noise(t,0.05,0.3,d,900); tone('square',520,t,0.07,0.12,d); }
  else if(n==='bad'){ tone('sawtooth',150,t,0.32,0.2,d,80); }
  else if(n==='alarm'){ for(i=0;i<6;i++) tone('square', i%2?620:880, t+i*0.14, 0.13, 0.11, d); }
  else if(n==='paper'){ noise(t,0.12,0.12,d,2500); }
  else if(n==='click'){ tone('square',880,t,0.03,0.07,d); }
  else if(n==='fired'){ [72,67,64,60].forEach(function(m,k){ tone('square',mtof(m),t+k*0.25,0.22,0.14,d); }); tone('triangle',mtof(36),t+1,0.9,0.25,d); }
  else if(n==='win'){ [60,64,67,72,76,79,84].forEach(function(m,k){ tone('square',mtof(m),t+k*0.09,0.12,0.11,d); }); }
}

function setTrack(name){ if(AU.track!==name){ AU.track=name; AU.step=0; } }
function schedule(){
  if(!AU.ctx) return;
  var tr=TRACKS[AU.track]||TRACKS.office, spb=60/(tr.bpm*(AU.rush?1.3:1)*(AU.speed||1))/2;
  if(AU.next < AU.ctx.currentTime) AU.next = AU.ctx.currentTime+0.02;
  while(AU.next < AU.ctx.currentTime+0.12){
    var i=AU.step%tr.lead.length, t=AU.next, L=tr.lead[i], B=tr.bass[i%tr.bass.length];
    if(L) tone('square',mtof(L),t,spb*0.9,0.045,AU.musicGain);
    if(B) tone('triangle',mtof(B),t,spb*0.95,0.12,AU.musicGain);
    if(i%2===0) noise(t,0.03,0.035,AU.musicGain,7000);
    if(i%8===4) noise(t,0.09,0.07,AU.musicGain,1500);
    AU.next+=spb; AU.step++;

}

     : o.sent ? '<p class="why">You sent it to <b>'+O(o.sent).name+'</b>.</p>' : '<p class="why">Emergencies have a timer. Read fast and stamp fast.</p>')+
    '<div class="answer"><img src="'+icon(o.expected)+'" alt=""><div><div class="small">This job needed'+stepTxt+':</div><div class="aname">'+e.name+'</div></div></div>'+
    '<p class="why">'+o.memo.why+'</p>'+
    '<div class="jobbox"><b>'+e.name+':</b> '+e.job+'</div>'+
    '<button class="btn big" id="mok" type="button">'+(o.sent?'Got it, try again':'Got it')+'</button>'+
  '</div></div>');
  modalCb=cb; $('mok').onclick=closeModal; $('mok').focus();
}
function closeModal(){
  var m=$('modal'); if(!m) return;
  m.remove(); var cb=modalCb; modalCb=null; if(cb) cb();
}
function openBook(){
  if($('book')) return;
  var keys = cur ? cur.L.stamps : Object.keys(ORGANELLES);
  document.body.insertAdjacentHTML('beforeend',
  '<div class="modal-back" id="book" role="dialog" aria-modal="true" aria-labelledby="btitle"><div class="modal paper bookm">'+
    '<div class="mhead" id="btitle">Reference book</div>'+
    '<p class="small">The shift clock keeps running while the book is open.</p>'+
    '<div class="guide">'+keys.map(guideCard).join('')+'</div>'+
    '<div class="row"><span></span><button class="btn" id="bclose" type="button">Close book (B)</button></div>'+
  '</div></div>');
  $('bclose').onclick=closeBook; $('bclose').focus();
}
function closeBook(){ var b=$('book'); if(b) b.remove(); }

/* ---------- report ---------- */
function gradeComment(g,sd){
  if(sd) return 'The cell shut down before the shift ended.';
  return {A:'Outstanding work. The cell ran like clockwork.', B:'Strong shift. A few orders went to the wrong place.', C:'The cell survived, but some organelles were confused.', D:'Rough shift. Review the missed topics and try again.', F:'The cell struggled. Use the study guide and try again.'}[g];
}
function fmtTime(t){ var s=Math.floor(t); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function survTable(id, entry){
  var list=(S.surv&&S.surv[id])||[];
  if(!list.length) return '<p class="small">No survival runs yet.</p>';
  return '<ol class="hs">'+list.map(function(e,i){
    return '<li class="'+(e===entry?'me':'')+'"><span class="hrank">#'+(i+1)+'</span><span class="hname">'+esc(e.name)+'</span><span class="hgrade"></span><span class="hscore">'+fmtTime(e.time)+'</span></li>';
  }).join('')+'</ol>';
}
function survivalReport(c, entry, rank){
  var tally={}; c.mistakes.forEach(function(k){ tally[k]=(tally[k]||0)+1; });
  var keys=Object.keys(tally).sort(function(a,b){ return tally[b]-tally[a]; }).slice(0,4);
  app.innerHTML =
  '<div class="brief"><div class="paper review">'+
    '<div class="paper-head"><span>Survival report</span><span>'+new Date().toLocaleDateString()+'</span></div>'+
    '<div class="gradestamp g-F" style="font-size:20px;width:130px">'+fmtTime(c.clock)+'</div>'+
    '<h2>'+esc(S.name)+'</h2>'+
    '<p class="why" style="margin:0">Survival mode: <b>'+c.L.name+'</b></p>'+
    '<div class="shut"><b>The pile won</b>You kept the cell alive for '+fmtTime(c.clock)+'. Orders were arriving every '+nextInterval().toFixed(1)+' seconds at the end.</div>'+
    '<div class="stats">'+
      '<div class="stat">Time survived<div class="v">'+fmtTime(c.clock)+'</div></div>'+
      '<div class="stat">Orders correct<div class="v">'+c.correct+'</div></div>'+
      '<div class="stat">Best streak<div class="v">'+c.best+'</div></div>'+
    '</div>'+
    '<h3>Longest survival: '+c.L.name+'</h3>'+
    (rank===0 ? '<p class="newhs">New record! #1</p>' : rank>0 ? '<p class="newhs">You made the board! #'+(rank+1)+'</p>' : '')+
    survTable(c.L.id, entry)+
    (keys.length?'<h3>What tripped you up</h3><div class="missed">'+keys.map(function(k){ var o=O(k); return '<div class="mitem"><img src="'+icon(k)+'" alt=""><div><b>'+o.name+'</b> (missed '+tally[k]+')<br>'+o.job+'</div></div>'; }).join('')+'</div>':'')+
    '<div class="row"><button class="btn quiet" id="tomap" type="button">Back to map</button><button class="btn big" id="again" type="button">Try to beat it</button></div>'+
  '</div></div>';
  window.scrollTo(0,0);
  $('again').onclick=function(){ sfx('stamp'); startSurvival(c.L.id); };
  $('tomap').onclick=mapScreen; $('again').focus();
}
function scoreTable(id, entry){
  var list=S.scores[id]||[];
  if(!list.length) return '<p class="small">No finished shifts yet.</p>';
  return '<ol class="hs">'+list.map(function(e,i){
    return '<li class="'+(e===entry?'me':'')+'"><span class="hrank">#'+(i+1)+'</span><span class="hname">'+esc(e.name)+'</span><span class="hgrade">'+e.grade+'</span><span class="hscore">'+e.score+'</span></li>';
  }).join('')+'</ol>';
}
function openScores(){
  if($('book')) return;
  var shown=LEVELS.filter(function(L){ return !L.hidden || unlocked(L.id) || (S.scores[L.id]||[]).length; });
  document.body.insertAdjacentHTML('beforeend',
  '<div class="modal-back" id="book" role="dialog" aria-modal="true" aria-labelledby="htitle"><div class="modal paper bookm">'+
    '<div class="mhead" id="htitle">Top 3 boards</div>'+
    '<p class="small">Shift scores count finished shifts only. Survival times count how long the cell lasted. Boards reset when the page is refreshed.</p>'+
    '<div class="guide">'+shown.map(function(L){ return '<div class="gcard" style="display:block"><div class="gname">'+L.name+'</div><div class="small">Shift scores</div>'+scoreTable(L.id)+(L.fixedOrder?'':'<div class="small" style="margin-top:8px">Survival times</div>'+survTable(L.id))+'</div>'; }).join('')+'</div>'+
    '<div class="row"><span></span><button class="btn" id="bclose" type="button">Close</button></div>'+
  '</div></div>');
  $('bclose').onclick=closeBook; $('bclose').focus();
}
function reportScreen(r){
  var c=r.c, tally={};
  c.mistakes.forEach(function(k){ tally[k]=(tally[k]||0)+1; });
  var keys=Object.keys(tally).sort(function(a,b){ return tally[b]-tally[a]; });
  var missed = keys.length
    ? '<div class="missed">'+keys.map(function(k){ var o=O(k); return '<div class="mitem"><img src="'+icon(k)+'" alt=""><div><b>'+o.name+'</b> (missed '+tally[k]+')<br>'+o.job+'</div></div>'; }).join('')+'</div>'
    : '<p class="why">No missed topics. Every order went to the right place.</p>';
  var s=Math.floor(c.clock);
  app.innerHTML =
  '<div class="brief"><div class="paper review">'+
    '<div class="paper-head"><span>Performance review</span><span>'+new Date().toLocaleDateString()+'</span></div>'+
    '<div class="gradestamp g-'+r.grade+'" aria-label="Grade '+r.grade+'">'+r.grade+'</div>'+
    '<h2>'+esc(S.name)+'</h2>'+
    '<p class="why" style="margin:0">Assignment: <b>'+c.L.name+'</b></p>'+
    (r.shutdown?'<div class="shut"><b>Cell shut down</b>Too many mistakes or a backed-up inbox. A cell cannot survive when its organelles stop working together.</div>':'')+
    '<div class="stats">'+
      '<div class="stat">Correct on first try<div class="v">'+c.correct+' / '+c.total+'</div></div>'+
      '<div class="stat">Accuracy<div class="v">'+Math.round(r.acc*100)+'%</div></div>'+
      '<div class="stat">Score<div class="v">'+c.score+'</div></div>'+
      '<div class="stat">Best streak<div class="v">'+c.best+'</div></div>'+
      '<div class="stat">Cell health<div class="v">'+Math.round(c.health)+'</div></div>'+
      '<div class="stat">Shift time<div class="v">'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</div></div>'+
    '</div>'+
    '<p class="why">'+gradeComment(r.grade,r.shutdown)+'</p>'+
    '<h3>Top 3 scores: '+c.L.name+'</h3>'+
    (r.rankNew===0 ? '<p class="newhs">New high score! #1</p>' : r.rankNew>0 ? '<p class="newhs">You made the board! #'+(r.rankNew+1)+'</p>' : '')+
    (r.shutdown ? '<p class="small">Shut-down shifts do not count for the board.</p>' : '')+
    scoreTable(c.L.id, r.entry)+
    '<h3>Topics to review</h3>'+missed+
    '<p class="small" style="margin-top:14px">Show this screen to your teacher.</p>'+
    '<div class="row"><button class="btn quiet" id="again" type="button">Try this cell again</button><button class="btn big" id="tomap" type="button">Back to map</button></div>'+
  '</div></div>';
  window.scrollTo(0,0);
  $('again').onclick=function(){ briefScreen(c.L.id); };
  $('tomap').onclick=mapScreen;
  $('tomap').focus();
}
function firedScreen(r){
  app.innerHTML =
  '<div class="center-screen"><div class="sign fired">'+
    '<div class="sign-top">Notice from bone marrow HQ</div>'+
    '<h1>You\u2019re fired!</h1>'+
    '<p class="lead">...and that is exactly what is supposed to happen. Mature red blood cells have <b>no nucleus</b> and <b>no mitochondria</b>. That leaves more room for hemoglobin and makes the cell flexible enough to squeeze through tiny blood vessels.</p>'+
    '<p class="lead">The catch: without a nucleus, a red blood cell cannot make new proteins or repair itself, so it only lasts about 120 days. Your body makes millions of new ones every second to keep up.</p>'+
    '<p class="lead"><b>Think about it:</b> why can\u2019t a red blood cell divide to make more of itself?</p>'+
    '<button class="btn big" id="toreview" type="button">See my performance review</button>'+
  '</div></div>';
  $('toreview').onclick=function(){ reportScreen(r); };
  $('toreview').focus();
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if(e.target && e.target.tagName==='INPUT') return;
  if($('modal')){ if(e.key==='Enter'||e.key==='Escape'||e.key===' '){ e.preventDefault(); closeModal(); } return; }
  if($('book')){ if(e.key==='Escape'||e.key==='b'||e.key==='B'){ e.preventDefault(); closeBook(); } return; }
  if(!cur || cur.ended || !$('tray')) return;
  var n=parseInt(e.key,10);
  if(n>=1 && n<=cur.L.stamps.length){ e.preventDefault(); stamp(cur.L.stamps[n-1]); }
  else if(e.key==='r'||e.key==='R') stamp('reject');
  else if(e.key==='p'||e.key==='P') togglePause();
  else if(e.key==='b'||e.key==='B') openBook();
});

titleScreen();
})();
</script>
</body>
</html>
